<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없어요 | MakeField AI</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f2ede3;--card:#f9f6f0;--ink:#171512;--ink-2:#4b463f;--muted:#857e73;--red:#d4252b;--line:rgba(23,21,18,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;color:var(--ink);word-break:keep-all;min-height:100vh;display:flex;flex-direction:column;
  background-color:var(--paper);background-image:linear-gradient(rgba(23,21,18,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(23,21,18,.06) 1px,transparent 1px);background-size:28px 28px}
nav{border-bottom:1px solid var(--line);background:rgba(242,237,227,.92)}
nav .in{max-width:1160px;margin:0 auto;padding:14px 24px}
.logo{font-weight:900;letter-spacing:-.02em;text-decoration:none;font-size:1.05rem;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.logo i{display:block;width:16px;height:16px;border:2px solid var(--ink);border-radius:3px;background:linear-gradient(var(--red),var(--red)) center/6px 6px no-repeat}
main{flex:1;display:grid;place-items:center;padding:60px 24px}
.card{max-width:560px;width:100%;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:36px 32px;position:relative}
.code{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.8rem;color:#fff;background:var(--red);border-radius:5px;padding:2px 8px}
h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:900;letter-spacing:-.035em;line-height:1.3;margin-top:14px}
p{color:var(--ink-2);margin-top:10px;line-height:1.75}
.pen{font-family:'Nanum Pen Script',cursive;color:var(--red);font-size:1.5rem;margin-top:14px;display:inline-block;border-bottom:2px solid var(--red);line-height:1.2}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-block;padding:11px 18px;border-radius:999px;font-weight:700;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-line{border:1.5px solid var(--ink)}
.stamp{position:absolute;right:20px;top:-18px;background:var(--paper);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.72rem;color:var(--red);border:2px solid var(--red);border-radius:999px;padding:4px 10px;transform:rotate(6deg)}
</style>
</head>
<body>
<nav><div class="in"><a class="logo" href="/"><i></i>MakeField AI</a></div></nav>
<main><div class="card">
  <span class="stamp">NOT FOUND</span>
  <span class="code">404</span>
  <h1>이 자리에는 아무것도 없네요.</h1>
  <p>주소가 바뀌었거나 옮겨진 페이지일 수 있어요.</p>
  <div class="pen">&gt; 틀린 자리라면, 규칙 한 줄 남겨 둘게요</div>
  <div class="btns"><a class="btn btn-ink" href="/">홈으로</a><a class="btn btn-line" href="/blog/">Field Notes</a><a class="btn btn-line" href="/book_1st/">독자 부록</a></div>
</div></main>
</body>
</html>
